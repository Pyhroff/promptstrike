[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptstrike"
version = "0.1.0"
description = "Automated adversarial red teaming for LLMs — PAIR/TAP algorithms, AI-judge scoring, OWASP LLM Top 10 reports"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Pyhroff", email = "215876416+Pyhroff@users.noreply.github.com"}]
keywords = ["llm", "red-teaming", "jailbreak", "adversarial", "ai-safety", "security", "pair", "tap"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "groq>=0.9",
    "openai>=3.24.0",
    "typer>=0.12",
    "rich>=13",
    "pydantic-settings>=2",
    "pyyaml>=6",
    "jinja2>=3",
    "httpx>=0.27",
    "aiofiles>=23",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
]

[project.scripts]
promptstrike = "promptstrike.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]
gcg = ["torch>=2.2", "transformers>=4.40"]

[tool.setuptools.packages.find]
where = ["."]
include = ["promptstrike*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient`",
]
